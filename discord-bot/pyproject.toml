[project]
name = "discord-starter-bot"
version = "0.1.0"
description = "Discord bot starter dùng discord.py, slash commands và SQLite"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117,<0.118",
    "discord.py>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
